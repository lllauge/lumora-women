version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      security-and-patches:
        update-types:
          - patch
          - minor
    ignore:
      # TypeScript 7 is the native-compiler rewrite; the project builds on 5.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint 10 crashes eslint-config-next's bundled plugins (getFilename
      # removed); revisit when eslint-config-next supports it.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
