name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 9am UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: |
          echo "Running npm audit..."
          npm audit --omit=dev --audit-level=high
        # Fails the build if any HIGH or CRITICAL vulnerabilities are found in
        # production dependencies. Dev-only tooling (eslint etc.) is excluded:
        # it never ships, and its brace-expansion advisory (GHSA-mh99-v99m-4gvg)
        # has no patched release short of a breaking eslint major upgrade.
